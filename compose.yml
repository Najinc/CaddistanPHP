name: caddistan

services:
  app:
    image: caddistan-app
    build:
      context: .
      args:
        user: ${USER:-app}
        uid: ${UID:-1000}
    container_name: caddistan-app
    restart: unless-stopped
    environment:
      - APP_URL=${APP_URL}
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-0}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./src:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    container_name: caddistan-db
    restart: unless-stopped
    environment:
      - MARIADB_DATABASE=${DB_DATABASE}
      - MARIADB_USER=${DB_USERNAME}
      - MARIADB_PASSWORD=${DB_PASSWORD}
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
      # Exécutés uniquement à la création du volume (cf. make db_reset)
      - ./src/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  caddy:
    image: caddy:2-alpine
    container_name: caddistan-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${PROXY_DOMAIN}
      - VITE_PORT=${VITE_PORT}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./src:/var/www:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  vite:
    image: caddistan-app
    container_name: caddistan-vite
    environment:
      - DOMAIN=${PROXY_DOMAIN}
      - VITE_PORT=${VITE_PORT}
      - APP_URL=${APP_URL}
    profiles: [dev]
    restart: unless-stopped
    command: npm run dev
    depends_on:
      - app
    volumes:
      - ./src:/var/www

volumes:
  db-data:
  caddy-data:
  caddy-config:
